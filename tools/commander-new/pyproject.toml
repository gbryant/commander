[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commander-new"
version = "0.1.0"
description = "Project scaffolding tool for the commander embedded framework"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
commander-new = "commander_new.cli:main"

[tool.hatchling.build.targets.wheel]
packages = ["src/commander_new"]
