; Run `pio run -e uno` from the commander/ root.
; Pico and ESP32 use CMake — see platform/pico/ and platform/esp32/.

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = /dev/cu.usbmodem1413301
monitor_port = /dev/cu.usbmodem1413301
monitor_speed = 115200
extra_scripts = pre:scripts/patch_freertos.py
lib_deps =
    https://github.com/feilipu/Arduino_FreeRTOS_Library.git
build_flags =
    -DMAX_COMMANDS=12
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/platform/arduino
build_src_filter =
    -<*>
    +<core/CommandRegistry.cpp>
    +<hal/arduino/hal.cpp>
    +<transport/uart/UartTransport.cpp>
    +<platform/arduino/main.cpp>
