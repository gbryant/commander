; Run `pio run -e uno` or `pio run -e r4` from the commander/ root.
; Pico and ESP32 use CMake — see platform/pico/ and platform/esp32/.

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = /dev/cu.usbmodem1413301
monitor_port = /dev/cu.usbmodem1413301
monitor_speed = 115200
extra_scripts =
    pre:scripts/patch_freertos.py
    pre:scripts/patch_irremote.py
lib_deps =
    https://github.com/feilipu/Arduino_FreeRTOS_Library.git
    z3t0/IRremote@^4.4.0
build_flags =
    -DMAX_COMMANDS=12
    -DCOMMANDER_IR_WALL
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/platform/arduino
build_src_filter =
    -<*>
    +<core/CommandRegistry.cpp>
    +<hal/arduino/hal.cpp>
    +<transport/uart/UartTransport.cpp>
    +<platform/arduino/main.cpp>
    +<platform/arduino/IRModule.cpp>

[env:r4]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/platform/arduino-r4
    -DconfigCHECK_FOR_STACK_OVERFLOW=2
    -DMAX_COMMANDS=12
build_src_filter =
    -<*>
    +<platform/arduino-r4/main.cpp>
    +<core/CommandRegistry.cpp>
    +<hal/arduino/hal.cpp>
    +<transport/uart/UartTransport.cpp>
    +<transport/telnet/arduino/ArduinoTelnetTransport.cpp>
