; Run `pio run -e uno` or `pio run -e r4` from the commander/ root.
; Pico and ESP32 use CMake — see platform/pico/ and platform/esp32/.

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; port is auto-detected: dev/uno/* pass it via scripts/find_port.py (USB VID/PID);
; raw `pio run -t upload` falls back to PlatformIO's own detection
monitor_speed = 115200
extra_scripts =
    pre:scripts/patch_freertos.py
    pre:scripts/patch_irremote.py
lib_deps =
    https://github.com/feilipu/Arduino_FreeRTOS_Library.git
    z3t0/IRremote@^4.4.0
build_flags =
    -DMAX_COMMANDS=12
    -DCOMMANDER_IR_WALL
    -DCOMMANDER_UNO_RUNNER
    -DconfigUSE_MALLOC_FAILED_HOOK=1
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/platform/arduino
build_src_filter =
    -<*>
    +<platform/arduino/main.cpp>
    +<runners/arduino-uno/runner.cpp>
    +<core/CommandRegistry.cpp>
    +<hal/arduino/hal.cpp>
    +<transport/uart/UartTransport.cpp>
    +<platform/arduino/IRModule.cpp>

; STM32F103C8 "Bluepill" — native: CMSIS + vendored FreeRTOS (ARM_CM3) + (later)
; raw TinyUSB. Flash via ST-Link clone:  dev/bluepill/bum   or   pio run -e bluepill -t upload
; FreeRTOS kernel is pulled from $FREERTOS_KERNEL_PATH (same checkout the Pico build uses)
; by scripts/stm32_freertos.py.
[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = cmsis
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts =
    pre:scripts/stm32_freertos.py
build_flags =
    -DMAX_COMMANDS=12
    -DSTM32F103xB
    -DCOMMANDER_BLUEPILL_RUNNER
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/platform/stm32-bluepill
build_src_filter =
    -<*>
    +<platform/stm32-bluepill/main.cpp>
    +<runners/stm32-bluepill/runner.cpp>
    +<platform/stm32-bluepill/clock.c>
    +<core/CommandRegistry.cpp>
    +<transport/uart/UartTransport.cpp>
    +<hal/stm32/hal.cpp>

; Same board, but the console is USB CDC (raw TinyUSB) instead of USART1.
; Build/flash:  pio run -e bluepill-usb -t upload   (the env:bluepill USART build stays as a fallback)
[env:bluepill-usb]
extends = env:bluepill
build_flags =
    ${env:bluepill.build_flags}
    -DCOMMANDER_STM32_USB_CONSOLE
extra_scripts =
    ${env:bluepill.extra_scripts}
    pre:scripts/stm32_tinyusb.py
build_src_filter =
    ${env:bluepill.build_src_filter}
    +<platform/stm32-bluepill/usb.c>
    +<platform/stm32-bluepill/usb_descriptors.c>

; The USB CDC app relocated to run above the davidgfnet DFU bootloader (app @ 0x08001000),
; so it can be re-flashed over USB with dfu-util — no ST-Link. Adds a `bootloader` command
; (reboots into DFU) + sets VTOR. Flash the bootloader once with dev/bluepill/flash-bootloader,
; then upload the app with dev/bluepill/upload-usb.
[env:bluepill-usb-dfu]
extends = env:bluepill-usb
build_flags =
    ${env:bluepill-usb.build_flags}
    -DCOMMANDER_STM32_DFU
    ; keep the ELF's first LOAD segment at 0x08001000 (not rounded to the 64K boundary
    ; 0x08000000), so an ST-Link `program firmware.elf` upload never stamps the bootloader.
    -Wl,-z,max-page-size=0x1000
board_build.ldscript = platform/stm32-bluepill/stm32f103c8_dfu.ld

; BIGTREETECH TFT35-E3 V3.0 (STM32F207VC) — native: CMSIS + vendored FreeRTOS (ARM_CM3).
; Flash via the board's 5-pin SWD header (RST/SWCLK/GND/SWDIO/3.3V):
;   dev/btt-tft35/bum   or   pio run -e btt-tft35 -t upload
; Console is USART2 (PA2=TX/PA3=RX, the "RS232" header) — needs a USB-TTL adapter.
; UNVERIFIED ON HARDWARE — headless-shell scope only (no LCD/touch driver yet). See
; hal/stm32f2/hal.cpp and PLAN.md for what's still open (HSE crystal frequency, the
; status LED pin — the SWD header and console UART are now confirmed from the schematic).
[env:btt-tft35]
platform = ststm32
board = genericSTM32F207VC
framework = cmsis
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts =
    pre:scripts/stm32_tft35_freertos.py
build_flags =
    -DMAX_COMMANDS=12
    -DSTM32F207xx
    -DCOMMANDER_TFT35_RUNNER
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/platform/btt-tft35
build_src_filter =
    -<*>
    +<platform/btt-tft35/main.cpp>
    +<runners/btt-tft35/runner.cpp>
    +<platform/btt-tft35/clock.c>
    +<core/CommandRegistry.cpp>
    +<transport/uart/UartTransport.cpp>
    +<hal/stm32f2/hal.cpp>

[env:r4]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/core
    -I${PROJECT_DIR}/platform/arduino-r4
    -DconfigCHECK_FOR_STACK_OVERFLOW=2
    -DMAX_COMMANDS=12
    -DCOMMANDER_R4_RUNNER
build_src_filter =
    -<*>
    +<platform/arduino-r4/main.cpp>
    +<runners/arduino-r4/runner.cpp>
    +<core/CommandRegistry.cpp>
    +<hal/arduino/hal.cpp>
    +<transport/uart/UartTransport.cpp>
